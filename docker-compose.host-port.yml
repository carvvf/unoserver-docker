# Development only: reach unoserver from the host, for a service started outside Docker.
# Applied on top of docker-compose.latest.yml. This gives the container a network with a way
# out, so LibreOffice can again fetch what a document links to: do not use it in production.
services:
  unoserver:
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-2003}:${CONTAINER_PORT:-2003}"
    networks:
      - unoserver-docker-net
      - host-access

networks:
  host-access:
