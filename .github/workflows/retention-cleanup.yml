name: Retention cleanup
run-name: Retention cleanup

on:
  schedule:
    # UTC schedule; Europe/Rome: Sunday 23:27 CET / Monday 00:27 CEST.
    - cron: '27 22 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Set to true to report candidates without deleting"
        required: false
        default: "false"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  cleanup-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old GHCR versions while retaining rollback images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETENTION_DAYS: "60"
          RETAIN_CUSTOM_VERSIONS: "10"
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER}"
          package_name="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          cutoff_epoch="$(date -u -d "${RETENTION_DAYS} days ago" +%s)"
          dry_run="${INPUT_DRY_RUN}"

          owner_type="$(gh api -H "Accept: application/vnd.github+json" "/users/${owner}" --jq '.type')"
          if [[ "${owner_type}" == "Organization" ]]; then
            package_scope="/orgs/${owner}"
          else
            package_scope="/users/${owner}"
          fi

          echo "Retention policy (GHCR): keep 'latest', the ${RETAIN_CUSTOM_VERSIONS} newest custom rebuilds and the manifests of kept tags, delete versions older than ${RETENTION_DAYS} days."
          echo "Owner type: ${owner_type}"
          echo "Package: ${package_name}"
          echo "Dry run: ${dry_run}"

          # Every page: the listing is newest first, so the oldest versions, the ones the
          # policy deletes, are on the last pages.
          set +e
          versions_json="$(
            gh api --paginate -H "Accept: application/vnd.github+json" \
              "${package_scope}/packages/container/${package_name}/versions?per_page=100" \
              2>/tmp/ghcr-retention.err | jq -s 'add // []'
          )"
          versions_rc=$?
          set -e
          if [[ ${versions_rc} -ne 0 ]]; then
            if grep -q "404" /tmp/ghcr-retention.err; then
              echo "GHCR package not found: ${package_name}. Nothing to clean."
              exit 0
            fi
            cat /tmp/ghcr-retention.err >&2
            exit ${versions_rc}
          fi

          scanned=0
          kept=0
          candidates=0
          deleted=0
          # The newest custom rebuilds, whatever their age, for rollback.
          retained_version_ids="$(
            jq -r '
              [
                .[]
                | select((.metadata.container.tags // []) | any(test("-custom\\.[0-9]+$")))
                | {id: .id, updated_at: (.updated_at // .created_at // "")}
              ]
              | sort_by(.updated_at)
              | reverse
              | .[0:env.RETAIN_CUSTOM_VERSIONS | tonumber][]
              | .id
            ' <<<"${versions_json}"
          )"

          # Each tag names an OCI index whose platform and attestation manifests GHCR lists
          # as separate untagged versions; deleting them breaks the tag that is kept.
          referenced_digests=""
          keep_reason() {
            local version="$1" updated_at
            updated_at="$(jq -r '.updated_at // .created_at // ""' <<<"${version}")"
            if jq -e '(.metadata.container.tags // []) | index("latest") != null' <<<"${version}" >/dev/null; then
              echo contains-latest
            elif grep -Fxq "$(jq -r '.id' <<<"${version}")" <<<"${retained_version_ids}"; then
              echo rollback-retention
            elif grep -Fxq "$(jq -r '.name' <<<"${version}")" <<<"${referenced_digests}"; then
              echo referenced-by-kept-tag
            elif [[ -z "${updated_at}" ]]; then
              echo missing-timestamp
            elif (( $(date -u -d "${updated_at}" +%s) >= cutoff_epoch )); then
              echo within-retention
            fi
          }

          # The index of every kept tag is read from the registry; any failure stops the job
          # before anything is deleted.
          owner_lc="$(echo "${owner}" | tr '[:upper:]' '[:lower:]')"
          registry_token="$(
            curl -fsS -u "${GITHUB_ACTOR:-token}:${GH_TOKEN}" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${owner_lc}/${package_name}:pull" \
              | jq -er '.token'
          )"
          while IFS= read -r version; do
            [[ -n "$(keep_reason "${version}")" ]] || continue
            digest="$(jq -r '.name' <<<"${version}")"
            manifest="$(
              curl -fsS -H "Authorization: Bearer ${registry_token}" \
                -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
                "https://ghcr.io/v2/${owner_lc}/${package_name}/manifests/${digest}"
            )"
            children="$(jq -r '.manifests[]?.digest' <<<"${manifest}")"
            if [[ -n "${children}" ]]; then
              referenced_digests="$(printf '%s\n%s' "${referenced_digests}" "${children}")"
            fi
          done < <(jq -c '.[] | select((.metadata.container.tags // []) | length > 0)' <<<"${versions_json}")

          while IFS= read -r version; do
            scanned=$((scanned + 1))
            version_id="$(jq -r '.id' <<<"${version}")"
            updated_at="$(jq -r '.updated_at // .created_at // ""' <<<"${version}")"
            tag_list="$(jq -r '(.metadata.container.tags // []) | join(",")' <<<"${version}")"

            reason="$(keep_reason "${version}")"
            if [[ -n "${reason}" ]]; then
              kept=$((kept + 1))
              echo "KEEP id=${version_id} tags=[${tag_list}] updated_at=${updated_at} reason=${reason}"
              continue
            fi

            candidates=$((candidates + 1))
            if [[ "${dry_run}" == "true" ]]; then
              echo "DRY-RUN candidate id=${version_id} tags=[${tag_list}] updated_at=${updated_at}"
              continue
            fi
            gh api --method DELETE -H "Accept: application/vnd.github+json" \
              "${package_scope}/packages/container/${package_name}/versions/${version_id}" >/dev/null
            deleted=$((deleted + 1))
            echo "DELETE id=${version_id} tags=[${tag_list}] updated_at=${updated_at}"
          done < <(jq -c '.[]' <<<"${versions_json}")

          {
            echo "## GHCR Retention Result"
            echo "- Retention days: ${RETENTION_DAYS}"
            echo "- Keep tag: latest"
            echo "- Custom versions retained for rollback: ${RETAIN_CUSTOM_VERSIONS}"
            echo "- Keep manifests referenced by kept tags: true"
            echo "- Dry run: ${dry_run}"
            echo "- Versions scanned: ${scanned}"
            echo "- Versions kept: ${kept}"
            echo "- Versions matching deletion policy: ${candidates}"
            echo "- Versions deleted: ${deleted}"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup-workflow-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed workflow runs older than 60 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETENTION_DAYS: "60"
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          cutoff_epoch="$(date -u -d "${RETENTION_DAYS} days ago" +%s)"
          dry_run="${INPUT_DRY_RUN}"

          echo "Retention policy (workflow runs): delete completed runs older than ${RETENTION_DAYS} days."
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Dry run: ${dry_run}"

          scanned=0
          kept=0
          candidates=0
          deleted=0
          page=1
          delete_manifest="$(mktemp)"

          while :; do
            page_json="$(gh api -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100&page=${page}")"
            page_count="$(jq '.workflow_runs | length' <<<"${page_json}")"

            if [[ "${page_count}" -eq 0 ]]; then
              break
            fi

            while IFS= read -r run; do
              scanned=$((scanned + 1))
              run_id="$(jq -r '.id' <<<"${run}")"
              status="$(jq -r '.status // ""' <<<"${run}")"
              created_at="$(jq -r '.created_at // ""' <<<"${run}")"
              run_name="$(jq -r '.name // "unknown"' <<<"${run}")"

              if [[ "${status}" != "completed" || -z "${created_at}" ]]; then
                kept=$((kept + 1))
                echo "KEEP run_id=${run_id} name=${run_name} reason=status-or-timestamp"
                continue
              fi

              run_epoch="$(date -u -d "${created_at}" +%s)"
              if (( run_epoch >= cutoff_epoch )); then
                kept=$((kept + 1))
                echo "KEEP run_id=${run_id} name=${run_name} created_at=${created_at} reason=within-retention"
                continue
              fi

              candidates=$((candidates + 1))
              if [[ "${dry_run}" == "true" ]]; then
                echo "DRY-RUN candidate run_id=${run_id} name=${run_name} created_at=${created_at}"
                continue
              fi

              jq -nc \
                --arg id "${run_id}" \
                --arg created_at "${created_at}" \
                --arg name "${run_name}" \
                '{id: $id, created_at: $created_at, name: $name}' >> "${delete_manifest}"
            done < <(jq -c '.workflow_runs[]' <<<"${page_json}")

            page=$((page + 1))
          done

          if [[ "${dry_run}" != "true" ]]; then
            while IFS= read -r row; do
              run_id="$(jq -r '.id' <<<"${row}")"
              created_at="$(jq -r '.created_at' <<<"${row}")"
              run_name="$(jq -r '.name' <<<"${row}")"
              gh api --method DELETE -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null
              deleted=$((deleted + 1))
              echo "DELETE run_id=${run_id} name=${run_name} created_at=${created_at}"
            done < "${delete_manifest}"
          fi

          rm -f "${delete_manifest}"

          {
            echo "## Workflow Run Retention Result"
            echo "- Retention days: ${RETENTION_DAYS}"
            echo "- Dry run: ${dry_run}"
            echo "- Runs scanned: ${scanned}"
            echo "- Runs kept: ${kept}"
            echo "- Runs matching deletion policy: ${candidates}"
            echo "- Runs deleted: ${deleted}"
          } >> "$GITHUB_STEP_SUMMARY"
