name: Publish custom image

on:
  workflow_dispatch:
    inputs:
      upstream_repository:
        description: "Upstream repository in owner/name format"
        required: true
        default: "unoconv/unoserver-docker"
      upstream_branch:
        description: "Upstream branch used for alignment and version base"
        required: true
        default: "main"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      upstream_tag: ${{ steps.version.outputs.upstream_tag }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify current branch is aligned with upstream
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${{ inputs.upstream_repository }}.git"
          git fetch --no-tags upstream "${{ inputs.upstream_branch }}:refs/remotes/upstream/${{ inputs.upstream_branch }}"

          if ! git merge-base --is-ancestor "refs/remotes/upstream/${{ inputs.upstream_branch }}" HEAD; then
            echo "Branch '${GITHUB_REF_NAME}' is not aligned with upstream '${{ inputs.upstream_repository }}:${{ inputs.upstream_branch }}'." >&2
            echo "Merge/rebase upstream first, then rerun this workflow." >&2
            exit 1
          fi

      - name: Compute custom version from upstream tag
        id: version
        run: |
          set -euo pipefail
          git fetch --tags upstream

          upstream_tag="$(git tag -l --merged "refs/remotes/upstream/${{ inputs.upstream_branch }}" | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          if [ -z "${upstream_tag}" ]; then
            echo "No upstream semver tag found on '${{ inputs.upstream_repository }}:${{ inputs.upstream_branch }}'." >&2
            exit 1
          fi

          base_version="${upstream_tag#v}"
          escaped_base_version="${base_version//./\\.}"

          max_n="$(
            git ls-remote --tags --refs origin \
              | awk '{print $2}' \
              | sed 's#refs/tags/##' \
              | grep -E "^v?${escaped_base_version}-custom\.[0-9]+$" \
              | sed -E "s/^v?${escaped_base_version}-custom\.([0-9]+)$/\\1/" \
              | sort -n \
              | tail -n1 \
              || true
          )"
          if [ -z "${max_n}" ]; then
            next_n=1
          else
            next_n=$((max_n + 1))
          fi

          version="${base_version}-custom.${next_n}"

          echo "upstream_tag=${upstream_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          {
            echo "## Preflight Result"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Upstream tag: ${upstream_tag}"
            echo "- Computed fork version: ${version}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Compute local image tag
        run: |
          platform_tag="${{ matrix.platform }}"
          platform_tag="${platform_tag//\//-}"
          echo "IMAGE_REF=local/unoserver-custom:${{ needs.preflight.outputs.version }}-${platform_tag}" >> "$GITHUB_ENV"

      - name: Build image (no publish)
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_REF }}
          provenance: false
          sbom: false

      - name: Scan image with Trivy (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Build summary
        run: |
          {
            echo "## Build Result"
            echo "- Built version: ${{ needs.preflight.outputs.version }}"
            echo "- Platform: ${{ matrix.platform }}"
            echo "- Publish pre-check: passed"
            echo "- Trivy policy: fail on HIGH,CRITICAL"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs:
      - preflight
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR (version + latest tags)
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.preflight.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Inspect pushed images
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.preflight.outputs.version }}
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Publish summary
        run: |
          {
            echo "## Publish Result"
            echo "- Published image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.preflight.outputs.version }}"
            echo "- Latest tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          } >> "$GITHUB_STEP_SUMMARY"
