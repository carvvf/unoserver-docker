name: Weekly Trivy scan for active GHCR image
run-name: Weekly Trivy scan

on:
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Force workflow failure for notification testing"
        required: false
        default: "false"
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  packages: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Force failure (manual test)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_fail == 'true' }}
        run: |
          echo "Forced failure for notification testing." >&2
          exit 1

      - name: Resolve GHCR latest image tag
        id: target
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER}"
          owner_lc="$(printf '%s' "${owner}" | tr '[:upper:]' '[:lower:]')"
          package_name="${GITHUB_REPOSITORY#*/}"
          tag="latest"
          image_ref="ghcr.io/${owner_lc}/${package_name}:${tag}"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"

          {
            echo "## Scan Target"
            echo "- Image: ${image_ref}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ steps.target.outputs.image_ref }}
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Summarize vulnerabilities
        id: summary
        run: |
          set -euo pipefail

          if [ ! -f trivy-report.json ]; then
            echo "Trivy report not found." >&2
            exit 1
          fi

          critical_count="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-report.json)"
          high_count="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-report.json)"

          has_findings="false"
          if [ "${critical_count}" -gt 0 ] || [ "${high_count}" -gt 0 ]; then
            has_findings="true"
          fi

          echo "critical_count=${critical_count}" >> "$GITHUB_OUTPUT"
          echo "high_count=${high_count}" >> "$GITHUB_OUTPUT"
          echo "has_findings=${has_findings}" >> "$GITHUB_OUTPUT"

          {
            echo "## Trivy Result"
            echo "- Image: ${{ steps.target.outputs.image_ref }}"
            echo "- CRITICAL: ${critical_count}"
            echo "- HIGH: ${high_count}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy report artifact
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: trivy-report-${{ github.run_id }}
          path: trivy-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail workflow on HIGH/CRITICAL findings
        if: ${{ steps.summary.outputs.has_findings == 'true' }}
        run: |
          echo "HIGH/CRITICAL vulnerabilities detected." >&2
          exit 1
