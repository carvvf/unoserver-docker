name: Publish image through the custom vulnerability gate

on:
  workflow_dispatch:
    inputs:
      enable_upstream_workflow:
        description: "Set to true to run the custom gated workflow manually"
        required: true
        default: "false"

permissions:
  contents: read
  packages: write

jobs:
  gated-workflow:
    if: ${{ github.event.inputs.enable_upstream_workflow == 'true' }}
    uses: ./.github/workflows/publish-custom.yml
    secrets: inherit
