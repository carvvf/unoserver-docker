name: Renovate
run-name: Renovate dependency updates

# Opens or refreshes one cumulative pull request with the updates the image workflows do not
# move on their own (see renovate.json5). Renovate acts as a GitHub App, so its pull request
# triggers this repository's workflows like any other, and it may update workflow files.
# The App is installed on this repository with these repository permissions: contents, pull
# requests and workflows read and write; checks and commit statuses read; metadata read.
on:
  schedule:
    # UTC schedule; Europe/Rome: Monday 00:47 CET / 01:47 CEST.
    - cron: '47 23 * * 0'
  workflow_dispatch:
    inputs:
      log_level:
        description: "Renovate log level"
        required: false
        default: "info"
        type: choice
        options:
          - info
          - debug

permissions:
  contents: read

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    # Renovate clones the repository itself with the App token; no checkout is needed.
    steps:
      - name: Create a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.210.1
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The repository configuration already exists; no onboarding pull request.
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Commits created through the API are signed by GitHub as the App.
          RENOVATE_PLATFORM_COMMIT: enabled
