name: Pull request checks
run-name: Checks for pull request ${{ github.event.pull_request.number }}

# Builds and scans the image of every pull request to custom for both platforms and runs the
# amd64 integration tests, through build-custom.yml, which applies the vulnerability policy
# of publication and never publishes. The reviewer sees the result before merging; nothing
# is merged automatically. Pull requests opened by the Renovate GitHub App start it too.
on:
  pull_request:
    branches:
      - custom

permissions:
  contents: read

# A new push to the pull request replaces the checks of the previous one.
concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-custom.yml
    permissions:
      contents: read
