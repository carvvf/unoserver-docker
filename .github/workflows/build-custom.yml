name: Build custom image
run-name: Build custom image

on:
  workflow_dispatch:
    inputs:
      image_tag_suffix:
        description: "Optional suffix for local image tags used during build/scan"
        required: false
        default: ""
  workflow_call:
    inputs:
      image_tag_suffix:
        description: "Optional suffix for local image tags used during build/scan"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute local image tag
        run: |
          tag_suffix="${{ inputs.image_tag_suffix }}"
          if [ -z "${tag_suffix}" ]; then
            tag_suffix="${GITHUB_SHA}"
          fi
          platform_tag="${{ matrix.platform }}"
          platform_tag="${platform_tag//\//-}"
          echo "PLATFORM_TAG=${platform_tag}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=local/unoserver-custom:${platform_tag}-${tag_suffix}" >> "$GITHUB_ENV"

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.custom
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          pull: true
          no-cache: true
          build-args: |
            IMAGE_VERSION=${{ inputs.image_tag_suffix }}
            IMAGE_REVISION=${{ github.sha }}
          tags: ${{ env.IMAGE_REF }}

      - name: Scan image with Trivy (fail on HIGH/CRITICAL)
        run: |
          set -euo pipefail

          trivy_image="$(scripts/trivy/trivy_image.sh)"
          echo "Trivy image: ${trivy_image}"
          echo "- Trivy scanner: ${trivy_image}" >> "$GITHUB_STEP_SUMMARY"
          docker pull "${trivy_image}"
          docker run --rm \
            -e TRIVY_DISABLE_TELEMETRY=true \
            -e TRIVY_SKIP_VERSION_CHECK=true \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "${trivy_image}" \
            image \
            --format table \
            --scanners vuln \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --db-repository mirror.gcr.io/aquasec/trivy-db:2 \
            --severity HIGH,CRITICAL \
            --pkg-types os,library \
            --timeout 40m \
            --exit-code 1 \
            "${IMAGE_REF}"

      - name: Install pytest (amd64 integration run)
        if: matrix.platform == 'linux/amd64'
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest

      - name: Start container for pytest integration test (amd64)
        if: matrix.platform == 'linux/amd64'
        run: |
          set -euo pipefail
          docker run -d \
            --name unoserver-docker-local \
            -p 2003:2003 \
            "${IMAGE_REF}"

      - name: Wait for XML-RPC endpoint readiness (amd64)
        if: matrix.platform == 'linux/amd64'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          import time
          import xmlrpc.client

          url = "http://127.0.0.1:2003"
          last_error = None

          for _ in range(60):
              try:
                  info = xmlrpc.client.ServerProxy(url, allow_none=True).info()
                  if isinstance(info, dict):
                      print(f"Endpoint ready: {info}")
                      sys.exit(0)
                  last_error = f"unexpected info() response type: {type(info)!r}"
              except Exception as exc:  # noqa: BLE001
                  last_error = str(exc)
              time.sleep(2)

          print(f"Endpoint did not become ready in time: {last_error}", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Run fixture conversion pytest (amd64)
        if: matrix.platform == 'linux/amd64'
        env:
          CONTAINER_NAME: unoserver-docker-local
          CONTAINER_PORT: '2003'
          API_PROTOCOL: http
        run: |
          python3 -m pytest -q tests/pytest_office_fixtures_to_pdf.py

      - name: Test that a hung conversion restarts the service (amd64)
        if: matrix.platform == 'linux/amd64'
        run: tests/test-conversion-timeout.sh

      - name: Show container logs on failure (amd64)
        if: failure() && matrix.platform == 'linux/amd64'
        run: docker logs --tail 200 unoserver-docker-local || true

      - name: Cleanup integration container (amd64)
        if: always() && matrix.platform == 'linux/amd64'
        run: docker rm -f unoserver-docker-local || true
