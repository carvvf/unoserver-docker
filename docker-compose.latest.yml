services:
  unoserver:
    #image: "${IMAGE_REF:-unoserver-docker:local}"
    image: "${IMAGE_REF:-ghcr.io/carvvf/unoserver-docker:latest}"
    container_name: "${CONTAINER_NAME:-unoserver-docker}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    cpus: "${CPU_LIMIT:-2}"
    mem_limit: "${MEMORY_LIMIT:-1g}"
    pids_limit: "${PIDS_LIMIT:-128}"
    tmpfs:
      - /tmp
    environment:
      HOME: /tmp
    # Development-only host exposure (loopback only).
    # In production, comment out this block to disable host access.
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-2003}:${CONTAINER_PORT:-2003}"
    # Internal Docker network for service-to-service communication.
    networks:
      - unoserver-docker-net
    restart: unless-stopped

networks:
  unoserver-docker-net:
    name: unoserver-docker-net
    driver: bridge
