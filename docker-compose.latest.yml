services:
  unoserver:
    #image: "${IMAGE_REF:-unoserver-docker:local}"
    image: "${IMAGE_REF:-ghcr.io/carvvf/unoserver-docker:latest}"
    container_name: "${CONTAINER_NAME:-unoserver-docker}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    cpus: "${CPU_LIMIT:-2}"
    mem_limit: "${MEMORY_LIMIT:-1g}"
    pids_limit: "${PIDS_LIMIT:-128}"
    tmpfs:
      - /tmp
    environment:
      HOME: /tmp
      # Seconds one conversion may take. Past it the service exits and restarts, so that a
      # document that hangs LibreOffice cannot block the conversions after it.
      UNOSERVER_CONVERSION_TIMEOUT: "${UNOSERVER_CONVERSION_TIMEOUT:-60}"
    # The only network, and it has no way out: LibreOffice fetches what a document links to
    # while converting it, and the documents are untrusted. No port is published, because an
    # internal network cannot publish one. scripts/unoserver/run-local.sh is for development.
    networks:
      - unoserver-docker-net
    restart: unless-stopped

networks:
  unoserver-docker-net:
    name: unoserver-docker-net
    driver: bridge
    internal: true
